[package]
name = "harmony"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
gpui-macros = "0.2.2"
gpui-component = "0.5.1"
matrix-sdk = "0.18.0"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "fs", "macros", "time"] }
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_ignored = "0.1.12"
serde_json = "1.0.150"
toml = "1.1.3"
rand = "0.10.2"
keyring = "4.1.5"
dirs-next = "2.0.0"
anyhow = "1.0.102"
rust-embed = "8.11.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
thiserror = "2.0.18"
